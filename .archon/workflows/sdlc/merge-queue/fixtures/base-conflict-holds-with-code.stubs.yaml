# Dry-run fixture: GitHub reports the pull request as conflicting with its base. The
# policy script records the fact, the gate holds with the stable code, and the
# execute node carries that code out so a composing lifecycle can merge the base.
ci-policy:
  requirement: "none"
  source: "declared"
  checks: []
  checks_state: "not_applicable"
  results: []
  reason: ""
  conflicts: ["https://github.com/example/app/pull/7"]
assess:
  summary: "stub: review and validation verified; the head conflicts with the base"
  eligible: false
  method: "squash"
  validation_verified: true
  review_verified: true
  holds: []
publish-holds:
  published: false
  updated: []
  summary: "stub: nothing to publish"
gate:
  ready: false
  summary: "the assessed batch is not eligible; pull request conflicts with its base: https://github.com/example/app/pull/7"
  method: "squash"
  plan_digest: "fixture"
  hold_code: "base_conflict"
refresh:
  authorized: false
  repository: "example/app"
  number: 7
  head_sha: "0123456789abcdef0123456789abcdef01234567"
  method: "squash"
  summary: "stub: gate not ready"
execute:
  done: true
  merged: false
  urls: []
  queued: []
  prior_base_sha: ""
  summary: "merge is not authorized"
  hold_code: "base_conflict"
fixture:
  expect: completed
  reached: [ci-policy, assess, gate, execute]
  inputs:
    prs: '["https://github.com/example/app/pull/7"]'
    mode: "auto"
    merge_method: "squash"
    required_checks: "none"

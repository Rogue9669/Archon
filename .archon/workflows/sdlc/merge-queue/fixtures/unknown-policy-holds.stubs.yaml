ci-policy:
  requirement: "unknown"
  source: ""
  checks: []
  checks_state: "unknown"
  results: []
  reason: "GitHub did not report the required checks for example/app@main: rulesets (HTTP 403). Declare them with the required_checks input"
  conflicts: []
assess:
  summary: "stub: review and validation verified"
  eligible: true
  method: "squash"
  validation_verified: true
  review_verified: true
